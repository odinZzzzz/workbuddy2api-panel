    <!-- 脸 -->
    <ellipse cx="98" cy="80" rx="47" ry="43" fill="#ffe9de" stroke="#f6c9b8" stroke-width="2"/>

    <!-- 刘海 -->
    <path d="M50 84 C 46 54 68 30 98 28 C 128 26 152 48 150 82 Q 143 92 135 86 Q 127 102 117 94 Q 107 108 97 98 Q 87 108 79 96 Q 70 102 64 92 Q 56 90 50 84 Z" fill="url(#wlgHair)" stroke="#4a8fd8" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- 头发高光 -->
    <path d="M66 46 C 76 38 92 34 106 37 C 96 41 82 43 72 49 C 68 48 66 47 66 46 Z" fill="#ffffff" opacity=".4"/>

    <!-- 眼睛（睁眼，CSS 眨眼） -->
    <g id="wlgEyes">
      <g>
        <ellipse cx="78" cy="86" rx="8.5" ry="10" fill="url(#wlgEye)"/>
        <ellipse cx="78" cy="87.5" rx="4" ry="6.2" fill="#144a7a"/>
        <circle cx="75.5" cy="81.5" r="3" fill="#ffffff"/>
        <circle cx="81" cy="90" r="1.5" fill="#ffffff" opacity=".9"/>
      </g>
      <g>
        <ellipse cx="118" cy="86" rx="8.5" ry="10" fill="url(#wlgEye)"/>
        <ellipse cx="118" cy="87.5" rx="4" ry="6.2" fill="#144a7a"/>
        <circle cx="115.5" cy="81.5" r="3" fill="#ffffff"/>
        <circle cx="121" cy="90" r="1.5" fill="#ffffff" opacity=".9"/>
      </g>
    </g>
    <!-- 闭眼（睡觉/被拎起来时显示） -->
    <g id="wlgEyesClosed" fill="none" stroke="#1e8fe0" stroke-width="3.5" stroke-linecap="round">
      <path d="M69 86 Q 78 94 87 86"/>
      <path d="M109 86 Q 118 94 127 86"/>
    </g>

    <!-- 眉毛 -->
    <g id="wlgBrows" fill="none" stroke="#8ad0ff" stroke-width="3" stroke-linecap="round" opacity=".85">
      <path d="M70 72 Q 78 67 86 70"/>
      <path d="M110 70 Q 118 67 126 72"/>
    </g>

    <!-- 腮红 -->
    <g id="wlgBlush" fill="#ffa9c2">
      <ellipse cx="66" cy="103" rx="8.5" ry="4.6"/>
      <ellipse cx="130" cy="103" rx="8.5" ry="4.6"/>
    </g>

    <!-- 嘴巴（默认/开心/难过/惊讶 多形态） -->
    <g id="wlgMouth">
      <path id="wlgMouthDefault" d="M92 104 Q 100 113 108 104 Z" fill="#e0607a" stroke="#d94f6a" stroke-width="1"/>
      <ellipse id="wlgMouthTongue" cx="100" cy="107.5" rx="3" ry="1.7" fill="#ff9db0"/>
      <path id="wlgMouthHappy" d="M89 101 Q 100 118 111 101 Z" fill="#e0607a" stroke="#d94f6a" stroke-width="1"/>
      <ellipse id="wlgMouthHappyTongue" cx="100" cy="108.5" rx="4" ry="2" fill="#ff9db0"/>
      <path id="wlgMouthSad" d="M93 109 Q 100 104 107 109" fill="none" stroke="#e0607a" stroke-width="3" stroke-linecap="round"/>
      <ellipse id="wlgMouthO" cx="100" cy="107" rx="4.6" ry="5.6" fill="#e0607a"/>
    </g>

    <!-- 侧发（垂在脸两侧，随风飘） -->
    <path id="wlgLockL" d="M56 78 C 42 84 36 100 40 118 C 42 126 49 131 55 126 C 60 121 60 106 60 94 Z" fill="url(#wlgHair)" stroke="#4a8fd8" stroke-width="2"/>
    <path id="wlgLockR" d="M140 76 C 154 82 160 96 156 112 C 154 120 147 125 141 120 C 136 115 136 100 136 88 Z" fill="url(#wlgHair)" stroke="#4a8fd8" stroke-width="2"/>

    <!-- 海星发卡 -->
    <g id="wlgStar">
      <path d="M70 51 L72.4 56.8 L78.6 57.2 L73.8 61.2 L75.3 67.3 L70 64 L64.7 67.3 L66.2 61.2 L61.4 57.2 L67.6 56.8 Z" fill="#ff9ecb" stroke="#ff7fb0" stroke-width="1.5" stroke-linejoin="round"/>
      <circle cx="70" cy="58" r="1.6" fill="#ffffff" opacity=".85"/>
    </g>

    <!-- 头顶喷水孔 + 喷泉（鲸鱼娘的本体特征！） -->
    <ellipse id="wlgBlow" cx="122" cy="33" rx="6.5" ry="3" fill="#6fafe0" stroke="#4f8fc8" stroke-width="1.5"/>
    <g id="wlgSpout">
      <path d="M122 31 C 120 22 121 14 126 8" fill="none" stroke="#9fd4f7" stroke-width="4.5" stroke-linecap="round"/>
      <ellipse cx="127" cy="7" rx="6" ry="3" fill="#bfe6ff"/>
      <circle cx="118" cy="11" r="2.2" fill="#9fd4f7"/>
      <circle cx="134" cy="15" r="1.8" fill="#9fd4f7"/>
      <circle cx="125" cy="3" r="2.4" fill="#bfe6ff"/>
    </g>
  </g>

