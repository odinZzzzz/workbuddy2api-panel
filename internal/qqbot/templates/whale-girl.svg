      <ellipse cx="163" cy="45" rx="3.4" ry="2.6"/>
      <rect x="165.6" y="31" width="2" height="14"/>
    </g>

  <!-- 睡觉 Zzz -->
  <g id="wlgZzz" fill="#7fc2f2">
      <path d="M150 34 L158 34 L150 42 L158 42" stroke="#7fc2f2" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
