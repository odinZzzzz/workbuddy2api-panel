    <path cx="88" cy="129" rx="21" ry="12" fill="#ffe9de" stroke="#f6c9b8" stroke-width="2" d="M108.88 126.80 L108.73 129.18 L107.78 131.54 L106.06 133.81 L103.65 135.89 L100.65 137.70 L97.15 139.19 L93.30 140.28 L89.25 140.93 L85.16 141.13 L81.17 140.87 L77.44 140.14 L74.12 138.99 L71.33 137.46 L69.18 135.60 L67.76 133.48 L67.12 131.20 L67.27 128.82 L68.22 126.46 L69.94 124.19 L72.35 122.11 L75.35 120.30 L78.85 118.81 L82.70 117.72 L86.75 117.07 L90.84 116.87 L94.83 117.13 L98.56 117.86 L101.88 119.01 L104.67 120.54 L106.82 122.40 L108.24 124.52 Z"/>
    <path cx="120" cy="127" rx="21" ry="12" fill="#ffe9de" stroke="#f6c9b8" stroke-width="2" d="M140.88 129.20 L140.24 131.48 L138.82 133.60 L136.67 135.46 L133.88 136.99 L130.56 138.14 L126.83 138.87 L122.84 139.13 L118.75 138.93 L114.70 138.28 L110.85 137.19 L107.35 135.70 L104.35 133.89 L101.94 131.81 L100.22 129.54 L99.27 127.18 L99.12 124.80 L99.76 122.52 L101.18 120.40 L103.33 118.54 L106.12 117.01 L109.44 115.86 L113.17 115.13 L117.16 114.87 L121.25 115.07 L125.30 115.72 L129.15 116.81 L132.65 118.30 L135.65 120.11 L138.06 122.19 L139.78 124.46 L140.73 126.82 Z"/>
    <ellipse cx="99" cy="131" rx="7.5" ry="6.5" fill="#ffe9de" stroke="#f6c9b8" stroke-width="1.8"/>
    <ellipse cx="113" cy="129" rx="7.5" ry="6.5" fill="#ffe9de" stroke="#f6c9b8" stroke-width="1.8"/>
  </g>

  <!-- ======== 笔记本电脑（工作模式出现） ======== -->
  <g id="wlgLaptop">
    <ellipse cx="160" cy="150" rx="44" ry="4" fill="rgba(20,50,100,.14)"/>
    <rect x="124" y="138" width="72" height="7" rx="2.5" fill="#e3ecf5" stroke="#b9c8d8" stroke-width="1.5"/>
    <rect x="130" y="120" width="60" height="18" rx="2.5" fill="#2c3e54" stroke="#b9c8d8" stroke-width="1"/>
    <rect x="132" y="122" width="56" height="14" fill="#0f2b45"/>
    <rect x="134" y="124" width="26" height="2" fill="#4fd6a8"/>
    <rect x="134" y="128" width="18" height="2" fill="#ffd98a"/>
    <rect x="134" y="132" width="22" height="2" fill="#7cc4f7"/>
