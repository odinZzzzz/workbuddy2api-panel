    <path cx="72" cy="123" rx="9" ry="10" fill="#cdeeff" stroke="#8ecdf7" stroke-width="2" d="M80.16 119.20 L80.82 121.04 L81.15 122.95 L81.13 124.87 L80.76 126.72 L80.05 128.42 L79.03 129.92 L77.74 131.15 L76.23 132.06 L74.55 132.63 L72.78 132.83 L70.98 132.65 L69.22 132.10 L67.57 131.20 L66.08 129.98 L64.82 128.50 L63.84 126.80 L63.18 124.96 L62.85 123.05 L62.87 121.13 L63.24 119.28 L63.95 117.58 L64.97 116.08 L66.26 114.85 L67.77 113.94 L69.45 113.37 L71.22 113.17 L73.02 113.35 L74.78 113.90 L76.43 114.80 L77.92 116.02 L79.18 117.50 Z"/>
