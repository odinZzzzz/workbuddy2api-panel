<!-- 来源：dsh-whale-lap（Linzr-lly），MIT License。
     静态可渲染版：清掉文本节点/transform/百分比尺寸；状态组由代码按 state 裁剪。 -->
<svg id="wlgGirl" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 170" width="320" height="170" aria-hidden="true">
  <!--
    趴趴鲸鱼娘 whale-girl.svg
    趴在对话框上沿的二次元鲸鱼娘：头枕双手、鲸尾上翘、头顶喷水孔。
    所有动效由 whale-lap.css 驱动（内联注入后可被页面 CSS 控制）。
  -->
  <title>趴趴鲸鱼娘</title>

  <defs>
    <linearGradient id="wlgHair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd0ff"/>
      <stop offset="1" stop-color="#4f96e8"/>
    </linearGradient>
    <linearGradient id="wlgDress" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2f4ff"/>
      <stop offset="1" stop-color="#a5d8f7"/>
    </linearGradient>
    <linearGradient id="wlgTail" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#b9e4ff"/>
      <stop offset="1" stop-color="#7fc2f2"/>
    </linearGradient>
    <linearGradient id="wlgEye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ed0ff"/>
      <stop offset="1" stop-color="#1e8fe0"/>
    </linearGradient>
  </defs>

  <!-- 趴在对话框上沿的接触阴影 -->
  <ellipse cx="168" cy="152.5" rx="122" ry="4.5" fill="rgba(30,60,120,.16)"/>

  <!-- ======== 双马尾（背后层，随风摇摆） ======== -->
  <g id="wlgTwinL">
    <path d="M60 62 C 36 56 20 66 14 84 C 9 98 12 108 22 110 C 30 112 38 104 41 92 C 44 80 50 70 60 68 Z" fill="url(#wlgHair)" stroke="#4a8fd8" stroke-width="2"/>
    <path d="M58 70 C 42 64 28 72 22 86 C 19 94 20 101 25 104" fill="none" stroke="#c9e9ff" stroke-width="3" stroke-linecap="round" opacity=".8"/>
  </g>
  <g id="wlgTwinR">
    <path d="M134 64 C 152 56 170 58 180 72 C 188 84 186 98 176 102 C 168 106 160 98 157 86 C 154 74 146 66 134 70 Z" fill="url(#wlgHair)" stroke="#4a8fd8" stroke-width="2"/>
    <path d="M138 70 C 154 64 166 68 173 78 C 178 86 177 94 171 98" fill="none" stroke="#c9e9ff" stroke-width="3" stroke-linecap="round" opacity=".8"/>
  </g>

  <!-- ======== 鲸鱼尾（上翘，摇尾巴） ======== -->
  <g id="wlgTail">
    <path d="M242 147 C 262 150 276 144 285 131 C 293 120 299 110 306 101" fill="none" stroke="url(#wlgTail)" stroke-width="26" stroke-linecap="round"/>
    <path d="M244 145 C 261 147 273 142 281 131 C 288 121 293 112 299 105" fill="none" stroke="#cdeeff" stroke-width="11" stroke-linecap="round" opacity=".9"/>
  </g>
  
    <path d="M 306 98 C 294 93 286 80 293 65 C 299 56 308 60 310 70 C 311 77 310 88 306 98 Z" fill="#8ecdf7" stroke="#5f9ad0" stroke-width="1.5"/>
    <path d="M 306 98 C 318 94 326 82 319 67 C 313 58 304 62 302 72 C 301 79 302 90 306 98 Z" fill="#8ecdf7" stroke="#5f9ad0" stroke-width="1.5"/>
    <path d="M 303 90 C 298 86 295 79 297 72" fill="none" stroke="#d8f0ff" stroke-width="3" stroke-linecap="round"/>
    <path d="M 309 91 C 313 87 316 81 315 73" fill="none" stroke="#d8f0ff" stroke-width="3" stroke-linecap="round"/>
  

  <!-- ======== 身体（裙摆+鲸鱼肚皮） ======== -->
  <g id="wlgBody">
    <path d="M150 124 C 156 112 172 107 200 105 C 228 103 246 112 250 126 L 250 150 L 150 150 Z" fill="url(#wlgDress)" stroke="#8ecdf7" stroke-width="2.5" stroke-linejoin="round"/>
    <ellipse cx="200" cy="144" rx="42" ry="9" fill="#f2fbff" stroke="#d3ebfa" stroke-width="2"/>
    <g id="wlgStripes" fill="none" stroke="#cfe9f9" stroke-width="2.5" stroke-linecap="round">
      <path d="M174 141 Q 182 145 190 142"/>
      <path d="M182 145 Q 190 149 198 146"/>
    </g>
  </g>

  <!-- 胸鳍（小手鳍，扑扇扑扇） -->
  <path id="wlgFinL" d="M157 131 C 148 135 142 143 146 150 C 150 154 159 149 163 142 C 165 137 162 132 157 131 Z" fill="#8ecdf7" stroke="#6fb2e4" stroke-width="2" stroke-linejoin="round"/>
  <path id="wlgFinR" d="M239 130 C 248 134 254 142 250 150 C 246 154 237 149 233 142 C 231 137 234 131 239 130 Z" fill="#8ecdf7" stroke="#6fb2e4" stroke-width="2" stroke-linejoin="round"/>

